# argocd-image-updater is installed directly from the upstream install.yaml
# (see docs/ArgoCD-Image-Updater-target-tracking-service.md) and is not
# otherwise tracked by GitOps in this repo. This strategic-merge patch trims
# its default resources (request 250m/512Mi, limit 500m/1Gi) down to match
# actual usage (~3m CPU / ~33Mi memory observed).
#
# Apply with:
#   kubectl patch deployment argocd-image-updater-controller -n argocd \
#     --type strategic --patch-file argocd/image-updater-resources-patch.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater-controller
  namespace: argocd
spec:
  template:
    spec:
      containers:
        - name: argocd-image-updater-controller
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
