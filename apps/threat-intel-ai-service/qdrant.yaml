apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: threat-intel-qdrant-pvc
  namespace: c4i
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-intel-qdrant
  namespace: c4i
  labels:
    app: threat-intel-qdrant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: threat-intel-qdrant
  template:
    metadata:
      labels:
        app: threat-intel-qdrant
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - target-tracking-service
                      - postgres
                      - redis
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.4
          ports:
            - containerPort: 6333
              protocol: TCP
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: qdrant-storage
          persistentVolumeClaim:
            claimName: threat-intel-qdrant-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: threat-intel-qdrant-service
  namespace: c4i
  labels:
    app: threat-intel-qdrant
spec:
  type: NodePort
  selector:
    app: threat-intel-qdrant
  ports:
    - port: 6333
      targetPort: 6333
      nodePort: 30333
      protocol: TCP
