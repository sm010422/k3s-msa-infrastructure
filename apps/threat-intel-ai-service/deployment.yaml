apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-intel-ai-service
  namespace: c4i
  labels:
    app: threat-intel-ai-service
    version: "1.0"
spec:
  # 복구 완료 -- 자동 색인(auto_index_enabled)/자동분석(ai.auto-analysis.enabled)을
  # 둘 다 기본 OFF로 고친 새 이미지가 배포된 뒤 다시 올림 (threat-intel-ai-service
  # 커밋 92942fd, target-tracking-service 커밋 cbb9a27).
  replicas: 1
  selector:
    matchLabels:
      app: threat-intel-ai-service
  template:
    metadata:
      labels:
        app: threat-intel-ai-service
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - target-tracking-service
                      - postgres
                      - redis
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: threat-intel-ai-service
          image: sm010422/threat-intel-ai-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: target-tracking-secrets
                  key: gemini-api-key
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: target-tracking-secrets
                  key: cohere-api-key
                  optional: true
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: target-tracking-config
                  key: kafka-bootstrap-servers
            - name: QDRANT_HOST
              value: "threat-intel-qdrant-service"
            - name: QDRANT_PORT
              value: "6333"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "300m"
          livenessProbe:
            # /health는 상태와 무관하게 항상 200이라 kafka_consumer_running이 false로
            # 몇 시간 방치돼도(2026-09-27 사건, docs/Chuseok-Power-Outage-Recovery.md)
            # 못 잡았다. /live는 그 값이 false면 503을 반환해서 파드 재시작을 유도한다.
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
