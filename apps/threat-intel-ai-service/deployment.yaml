apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-intel-ai-service
  namespace: c4i
  labels:
    app: threat-intel-ai-service
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: threat-intel-ai-service
  template:
    metadata:
      labels:
        app: threat-intel-ai-service
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - target-tracking-service
                      - postgres
                      - redis
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: threat-intel-ai-service
          image: sm010422/threat-intel-ai-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: target-tracking-secrets
                  key: gemini-api-key
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: target-tracking-config
                  key: kafka-bootstrap-servers
            - name: QDRANT_HOST
              value: "threat-intel-qdrant-service"
            - name: QDRANT_PORT
              value: "6333"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
