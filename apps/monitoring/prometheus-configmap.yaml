apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      # Prometheus 자기 자신 -- TSDB 상태/스크랩 건강도 자체 모니터링용.
      # "Prometheus Stats"(grafana.com ID 3662) 대시보드가 이 job을 전제로 한다.
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # kube-state-metrics -- 파드 상태(재시작 횟수, Pending 여부), 디플로이먼트
      # replica 현황 등 k8s 오브젝트 레벨 정보. node-exporter는 여전히 안 깜(worker1/
      # worker2 여유를 더 깎는 결정이라 보류 중, docs/Lightweight-Prometheus-Grafana-Monitoring.md 참고)
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc.cluster.local:8080"]

      # threat-intel-ai-service -- prometheus_client(Python), FastAPI 라우트로 직접 노출
      - job_name: threat-intel-ai-service
        metrics_path: /ai/metrics
        static_configs:
          - targets: ["threat-intel-ai-service.c4i.svc.cluster.local:8000"]

      # target-tracking-service -- Spring Boot Actuator + Micrometer
      - job_name: target-tracking-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["target-tracking-service.c4i.svc.cluster.local:8080"]

      # 노드/파드 CPU·메모리 -- node-exporter 없이 kubelet 내장 cAdvisor를
      # API 서버 프록시로 스크랩 (10250 직접 접근 불필요, RBAC만 있으면 됨)
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
