apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: monitoring
---
# cluster-admin 바인딩 -- 과하다고 느껴질 수 있지만, 이 클러스터는 이미 SSH+kubectl로
# 전체 접근 가능한 상태라 대시보드 토큰 권한을 좁힌다고 실질적인 위협 모델이 줄지
# 않는다(Prometheus/Grafana NodePort와 동일하게 Tailscale 밖으로는 노출 안 됨).
# 스코프를 좁히고 싶어지면 view/edit ClusterRole로 교체.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: monitoring
---
# Headlamp 로그인 화면에 붙여넣을 장기 토큰. kubectl로 조회해서 사용:
#   kubectl get secret headlamp-admin -n monitoring -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-admin
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: "headlamp-admin"
type: kubernetes.io/service-account-token
