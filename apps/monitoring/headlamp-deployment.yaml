apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: monitoring
  labels:
    app: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp-admin
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - kafka
                        - threat-intel-qdrant
                        - target-tracking-service
                        - postgres
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.41.0
          args:
            - "-in-cluster"
          env:
            # OTel 콜렉터가 이 클러스터에 없어서 tracing/OTLP 관련 env는 일부러 뺐다
            # (공식 예시 매니페스트엔 있지만 없는 엔드포인트를 가리키면 에러만 남음).
            # metrics만 켜서 Prometheus가 그대로 스크랩하게 한다.
            - name: HEADLAMP_CONFIG_METRICS_ENABLED
              value: "true"
          ports:
            - containerPort: 4466
              name: http
            - containerPort: 9090
              name: metrics
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "200Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 4466
            initialDelaySeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4466
            initialDelaySeconds: 20
            timeoutSeconds: 10
