apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-tracking-service
  namespace: c4i
  labels:
    app: target-tracking-service
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-tracking-service
  template:
    metadata:
      labels:
        app: target-tracking-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - kafka
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: target-tracking-service
          image: sm010422/target-tracking-service:cb6398e1ae2a821fa35030a0bbf1b359ed0c3d38
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              hostPort: 8080
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: target-tracking-secrets
                  key: db-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: target-tracking-secrets
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: target-tracking-secrets
                  key: db-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: target-tracking-config
                  key: kafka-bootstrap-servers
            - name: SPRING_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: target-tracking-config
                  key: redis-host
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: target-tracking-secrets
                  key: gemini-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: target-tracking-config
  namespace: c4i
data:
  kafka-bootstrap-servers: "kafka-service.c4i.svc.cluster.local:9092"
  redis-host: "redis-service.c4i.svc.cluster.local"
