# k3s-master(컨트롤 플레인)에 의도적으로 배치 -- 이 클러스터의 평소 컨벤션은
# "컨트롤 플레인은 피한다"(다른 앱들의 nodeAffinity 참고)지만, 두 워커가 이미
# 메모리 74%로 빡빡한 상태(docs/concepts/09-swarm-load-generator-design-discussion.md
# 7번 항목 참고 -- 바로 그 노드들에서 자원 경합으로 장애가 난 적 있음)인 반면
# master는 CPU 2코어/메모리 여유가 더 많아서, 메모리를 꽤 쓴다는 GitNexus
# 인덱싱 워크로드엔 오히려 master가 더 안전하다고 판단해 컨벤션을 깼다.
#
# GITNEXUS_PUBLIC_ORIGIN은 일부러 안 넣는다 -- 실측(로컬 smoke test)으로 확인함:
# 와일드카드 바인드(--host 0.0.0.0)에서 이 값을 설정하면 "gitnexus serve has no
# authentication yet... reach the server through a proxy that authenticates for
# it" 메시지와 함께 서버가 시작 자체를 거부한다. 즉 이 변수를 안 넣는 게 아니라
# 못 넣는다 -- 넣으면 못 뜬다. 대신 쓰기 라우트(POST /api/analyze, DELETE
# /api/repo)는 기본적으로 loopback 오리진만 허용되므로, NodePort/Tailscale
# 주소로 접속하면 그래프 열람은 되지만 UI에서 직접 인덱싱 버튼을 누르는 건
# 막힐 수 있다 -- 인덱싱은 `kubectl exec`로 파드 안에서 CLI를 직접 돌리거나
# `kubectl port-forward`로 localhost 터널링해서 하는 걸 권장.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitnexus
  namespace: tools
  labels:
    app: gitnexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitnexus
  template:
    metadata:
      labels:
        app: gitnexus
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-master
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
      containers:
        - name: gitnexus
          image: sm010422/gitnexus:1.6.12
          imagePullPolicy: Always
          ports:
            - containerPort: 4747
              name: http
          env:
            - name: GITNEXUS_HOME
              value: /data/.gitnexus
            # Dockerfile의 ssh-agent가 이 경로에 고정 바인드된다 -- 파드 환경변수로
            # 선언해두면 `kubectl exec`로 들어가는 어떤 세션(auto-sync 수동 실행 등)도
            # 같은 agent 소켓을 찾아서 레포별 배포키를 쓸 수 있다.
            - name: SSH_AUTH_SOCK
              value: /tmp/ssh-agent.sock
            # /api/mcp 라우트 보호용(요청하신 조건). 일반 웹 UI/쓰기 라우트는
            # 이 토큰과 무관하게 위 주석의 loopback-only 제약을 그대로 받는다.
            - name: GITNEXUS_MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitnexus-secrets
                  key: mcp-auth-token
            # 레포마다 전용 배포키를 쓰는데(동일 키를 여러 레포 deploy key로 재등록은
            # GitHub가 거부함) 전부 github.com 하나라 host별 IdentityFile로 구분이
            # 안 된다 -- 그래서 -i를 명시 안 하고 ssh-agent(엔트리포인트에서 키 전부
            # 로드)가 레포별로 맞는 키를 알아서 고르게 한다. known_hosts는 PVC(/data,
            # 영구 저장)에 둬서 재시작마다 새로 TOFU 안 해도 되게 함.
            - name: GIT_SSH_COMMAND
              value: >-
                ssh -o StrictHostKeyChecking=accept-new
                -o UserKnownHostsFile=/data/.ssh/known_hosts
          volumeMounts:
            - name: data
              mountPath: /data
            - name: ssh-key
              mountPath: /etc/gitnexus-ssh
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              # 1Gi로 시작했다가 `gitnexus group sync`(레포 3개 동시에 열어서 계약
              # 추출+교차 링크)가 OOMKilled로 죽는 걸 보고 2Gi로 올렸다 -- 단일 레포
              # analyze/auto-sync보다 group sync가 메모리를 더 쓴다. master 메모리
              # 여유(이 시점 기준 약 1.2GB)를 넘지 않는 선에서 조정.
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /
              port: 4747
            initialDelaySeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 4747
            initialDelaySeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitnexus-data
        - name: ssh-key
          secret:
            secretName: gitnexus-ssh-key
            # Secret 볼륨은 root 소유로 마운트되는데 컨테이너는 USER node(UID 1000)로
            # 돈다 -- 0400(소유자만 읽기)이면 node가 못 읽는다. ssh의 실제 키 권한
            # 검사는 group/other의 "쓰기" 비트만 거부하므로(읽기 비트는 상관없음),
            # 0444(모두 읽기, 쓰기 비트 없음)로 풀어서 node 유저도 읽게 한다.
            defaultMode: 0444
