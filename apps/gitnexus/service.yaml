# Headlamp/Grafana/Prometheus와 동일한 패턴 -- NodePort만, Ingress는 안 쓴다.
# 이 클러스터의 Traefik Ingress는 Tailscale Funnel을 통해 전부 공인 인터넷에
# 노출되므로(docs/Public-Access-via-Tailscale-Funnel.md), Ingress를 쓰면
# "내부 전용"이 아니라 "전 세계 공개"가 된다. NodePort는 Funnel을 안 타고
# tailnet(사설망)에서만 접속되므로 이게 진짜 내부 전용 패턴이다.
apiVersion: v1
kind: Service
metadata:
  name: gitnexus
  namespace: tools
  labels:
    app: gitnexus
spec:
  type: NodePort
  selector:
    app: gitnexus
  ports:
    - port: 4747
      targetPort: 4747
      nodePort: 30747
      protocol: TCP
